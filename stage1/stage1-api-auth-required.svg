<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280">
  <style>
    .title { font: bold 18px monospace; fill: #222; }
    .line { font: 14px monospace; fill: #111; }
    .error { fill: #b22222; }
    .hint { fill: #555; }
  </style>
  <rect x="0" y="0" width="900" height="280" fill="#f5f5f5" />
  <text x="20" y="30" class="title">Stage 1: Notification priority script run</text>
  <text x="20" y="70" class="line">$ npm run stage1</text>
  <text x="20" y="100" class="line">> logging-middleware-app@1.0.0 stage1</text>
  <text x="20" y="120" class="line">> node src/stage1PriorityInbox.js</text>
  <text x="20" y="160" class="error">Error: Notification API returned 401: {"message":"An authorization header is required"}</text>
  <text x="20" y="200" class="hint">Note: To fetch actual notification data, set the bearer token in the</text>
  <text x="20" y="220" class="hint">environment variable NOTIF_API_TOKEN and rerun the script.</text>
</svg>
